name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, boundaries, types, tests, build
    runs-on: ubuntu-latest
    services:
      # Unit tests use an embedded Postgres; db:check runs the adapters on a real one too.
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: chessy
          POSTGRES_PASSWORD: chessy
          POSTGRES_DB: chessy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chessy -d chessy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run check:boundaries
      - run: bunx turbo run typecheck test build
      - name: Database adapters on PostgreSQL
        working-directory: apps/api
        run: bun run db:check
        env:
          DATABASE_URL: postgres://chessy:chessy@localhost:5432/chessy

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: apps/web
        run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
