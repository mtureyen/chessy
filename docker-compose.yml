# PostgreSQL for the server's copy of the game history.
#   docker compose up -d db
# then run the API with DATABASE_URL=postgres://chessy:chessy@localhost:5433/chessy (see
# apps/api/.env.example). Port 5433, so it doesn't clash with a local PostgreSQL on 5432.
services:
  db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: chessy
      POSTGRES_PASSWORD: chessy
      POSTGRES_DB: chessy
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - chessy-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chessy -d chessy']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  chessy-db:
